[project]
name = "company-enrichment"
version = "0.1.0"
description = "Company data-enrichment pipeline: find official websites and describe business/customers using Exa search, web scraping and LLM entity resolution via OpenRouter."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "openai>=1.30",
    "playwright>=1.40",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
